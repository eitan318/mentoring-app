name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore API
        run: dotnet restore src/MentoringApp.Api/MentoringApp.Api.csproj

      - name: Restore Web
        run: dotnet restore src/MentoringApp.Web/MentoringApp.Web.csproj

      - name: Restore Tests
        run: dotnet restore Tests/MentoringApp.Tests/MentoringApp.Tests.csproj

      - name: Build API
        run: dotnet build src/MentoringApp.Api/MentoringApp.Api.csproj -c Release --no-restore

      - name: Build Web
        run: dotnet build src/MentoringApp.Web/MentoringApp.Web.csproj -c Release --no-restore

      - name: Build Tests
        run: dotnet build Tests/MentoringApp.Tests/MentoringApp.Tests.csproj -c Release --no-restore

      - name: Run unit tests
        run: dotnet test Tests/MentoringApp.Tests/MentoringApp.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

      - name: Build API Docker image
        run: docker build -f Dockerfile.api -t mentoring-api:ci .

      - name: Build Web Docker image
        run: docker build -f Dockerfile.web -t mentoring-web:ci .
