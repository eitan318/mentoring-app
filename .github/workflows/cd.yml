name: CD

on:
  push:
    branches: [main]

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: mentoring-rg
  API_APP_NAME: mentoring-api
  WEB_APP_NAME: mentoring-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        run: |
          docker build -f Dockerfile.api \
            -t ${{ env.ACR_LOGIN_SERVER }}/mentoring-api:${{ steps.tag.outputs.tag }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/mentoring-api:latest \
            .
          docker push ${{ env.ACR_LOGIN_SERVER }}/mentoring-api:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/mentoring-api:latest

      - name: Build and push Web image
        run: |
          docker build -f Dockerfile.web \
            -t ${{ env.ACR_LOGIN_SERVER }}/mentoring-web:${{ steps.tag.outputs.tag }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/mentoring-web:latest \
            .
          docker push ${{ env.ACR_LOGIN_SERVER }}/mentoring-web:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/mentoring-web:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set API secrets in Azure Container Apps
        run: |
          az containerapp secret set \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "jwt-secret=${{ secrets.JWT_SECRET }}" \
              "smtp-password=${{ secrets.EMAIL_PASSWORD }}"

      - name: Deploy API to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/mentoring-api:${{ needs.build-and-push.outputs.image-tag }} \
            --set-env-vars \
              "JwtSettings__Secret=secretref:jwt-secret" \
              "EmailSettings__FromPassword=secretref:smtp-password" \
              "EmailSettings__FromEmail=${{ secrets.EMAIL_FROM }}" \
              "AppSettings__AdminEmail=${{ secrets.ADMIN_EMAIL }}" \
              "AllowedOrigins=${{ secrets.ALLOWED_ORIGINS }}" \
              "AppSettings__RecreateDbOnStartup=false" \
              "AppSettings__SkipVerificationCode=false"

      - name: Deploy Web to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.WEB_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/mentoring-web:${{ needs.build-and-push.outputs.image-tag }} \
            --set-env-vars \
              "ApiSettings__BaseUrl=${{ secrets.API_BASE_URL }}"
